trade: photographer
display_name: Photographer
thresholds: {subject: 3, intent: 3}
recency_half_life_hours: 168   # planned

subject:
  - terms: ["photographer", "portrait photographer", "family photographer", "photog"]
    weight: 3
    label: the-trade-itself
  - terms: ["photoshoot", "photo shoot", "headshots", "headshot", "family photos", "portraits", "senior pictures", "senior portraits", "maternity shoot", "newborn photos", "cap and gown photos", "holiday card photos", "christmas card pictures", "real estate photos", "listing photos", "product photos", "event photos", "boudoir", "mini session", "golden hour", "photo gallery", "prints"]
    weight: 3
    label: what-the-work-involves
  - terms: ["engagement photos", "edited photos"]
    weight: 1
    label: shared-with-other-trades

intent:
  - terms: ["photos are outdated", "still using a selfie", "no good pictures of us", "last family photo was years ago", "before the baby comes", "before he graduates", "grandparents keep asking for pictures", "linkedin profile picture is ancient", "our photographer cancelled", "photographer ghosted us", "never got our photos back", "photos came back blurry", "the edits look awful", "only have phone pictures"]
