    kind: problem
    label: something-is-wrong
  - terms: ["need a photographer", "looking for a photographer", "anyone know a good photographer", "photographer recommendations", "good photographer near me", "best photographer", "photographer needed", "iso photographer", "need help with my photoshoot", "help with my photoshoot", "need help with my photo shoot", "help with my photo shoot", "need help with my headshots", "help with my headshots", "photos are outdated", "still using a selfie", "no good pictures of us", "last family photo was years ago"]
