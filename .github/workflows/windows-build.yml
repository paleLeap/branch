name: Windows build

# A Windows executable can only be built on Windows -- PyInstaller bundles the
# host's Python and Qt DLLs, so there is no cross-compile from Linux. This is
# how Branch gets a .exe without anyone owning a Windows machine.
#
# Push a tag (v0.1.0) to attach the zip to a GitHub release; otherwise the build
# runs on every push to main and leaves the zip as an artifact for 30 days.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # A new repository's workflow token is read-only, so attaching the zip to
      # a release 403s -- "Resource not accessible by integration". The build
      # itself succeeds, which makes it look like a build failure when it is a
      # permission one. Write access to contents is only needed for the release
      # step; everything else runs read-only.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match what the project is developed against. Qt wheels lag new
          # Python releases, so this is pinned rather than "latest".
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test
        # The suite runs headless. If it cannot, the build is not worth making.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Build
        run: pyinstaller --clean --noconfirm branch.spec

      - name: Verify the build has its data
        # The failure this catches is silent: a build missing cities.csv.gz or
        # the profiles starts, looks correct, and finds nothing.
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\Branch\Branch.exe --check

      # PyInstaller 6 puts every bundled data file under _internal\, including
      # the ones written to be READ. Somebody who unzips this sees Branch.exe
      # and a folder of DLLs, and the start guide -- the whole point of which is
      # to be the first thing in the folder -- is three clicks away inside
      # _internal. The NOTICE is required to be visible by CC BY 4.0, too.
      # Copy them up beside the exe. They stay in _internal as well; the
      # duplicates are a few kilobytes against a 212MB folder.
      - name: Put the readable files where a person will see them
        run: |
          Copy-Item dist\Branch\_internal\START-HERE.txt dist\Branch\
          Copy-Item dist\Branch\_internal\README.md dist\Branch\
          Copy-Item dist\Branch\_internal\LICENSE dist\Branch\
          Copy-Item dist\Branch\_internal\NOTICE dist\Branch\
          if (-not (Test-Path dist\Branch\START-HERE.txt)) { exit 1 }

      - name: Zip
        run: Compress-Archive -Path dist\Branch\* -DestinationPath Branch-windows.zip

      # A zip is not an install. It asks somebody to extract a folder, keep it
      # together, and find one .exe among a folder of DLLs -- and the person
      # this is built for could not get past it. The installer is one file to
      # double-click, and it puts Branch in the Start menu like any other
      # program. Inno Setup ships on the GitHub Windows runner already.
      - name: Installer
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "0.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer.iss
          if (-not (Test-Path Branch-Setup.exe)) {
            Write-Error "the installer did not build"; exit 1
          }
          $size = (Get-Item Branch-Setup.exe).Length / 1MB
          Write-Host ("Branch-Setup.exe is {0:N0}MB" -f $size)
          # A few KB means it built an installer with no program inside it.
          if ($size -lt 50) { Write-Error "installer is too small to contain Branch"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Branch-windows
          path: Branch-windows.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # The installer first: it is the one most people should take.
          files: |
            Branch-Setup.exe
            Branch-windows.zip
